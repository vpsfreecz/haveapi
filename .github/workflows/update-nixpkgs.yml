name: update nixpkgs

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: update-nixpkgs-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFCTL_FLAKE: github:vpsfreecz/confctl/822c0e35dbe2549111912f539116b4225dfd3035#confctl
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    name: Update nixpkgs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Nix
        uses: cachix/install-nix-action@31.11.3

      - name: Install jq
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes jq
          fi

      - name: Restore confctl cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/confctl
          key: confctl-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            confctl-cache-${{ runner.os }}

      - name: Save lock baseline
        run: |
          cp flake.lock "$RUNNER_TEMP/flake-update-baseline.lock"
          echo "UPDATE_OLD_LOCK=$RUNNER_TEMP/flake-update-baseline.lock" >> "$GITHUB_ENV"

      - name: Configure git author
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update nixpkgs
        id: update
        shell: bash
        run: |
          before=$(git rev-parse HEAD)
          ./utils/update-nixpkgs.sh
          after=$(git rev-parse HEAD)

          if [ "$before" != "$after" ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push update
        if: steps.update.outputs.committed == 'true'
        shell: bash
        run: |
          final_lock="$RUNNER_TEMP/flake-update-final.lock"
          git show HEAD:flake.lock > "$final_lock"
          nix shell "$CONFCTL_FLAKE" -c confctl inputs check-update \
            --old-lock "$UPDATE_OLD_LOCK" --new-lock "$final_lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Save confctl cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/confctl
          key: confctl-cache-${{ runner.os }}-${{ github.run_id }}
