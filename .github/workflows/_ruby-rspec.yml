name: Ruby RSpec (shared)

on:
  workflow_call:
    inputs:
      rspec-working-directory:
        type: string
        required: true
      needs-server-gems:
        type: boolean
        required: false
        default: true
      setup-go:
        type: boolean
        required: false
        default: false

jobs:
  rspec:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Ruby + Bundler cache (servers/ruby)
        if: ${{ inputs.needs-server-gems }}
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: servers/ruby

      - name: Set up Ruby + Bundler cache
        if: ${{ inputs.rspec-working-directory != 'servers/ruby' }}
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ inputs.rspec-working-directory }}

      - name: Set up Go
        if: ${{ inputs.setup-go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Generate shared server documentation
        if: ${{ inputs.rspec-working-directory == 'servers/ruby' }}
        run: make doc

      - name: Set up Node for rendered TypeScript examples
        if: ${{ inputs.rspec-working-directory == 'servers/ruby' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Prepare public JavaScript declarations
        if: ${{ inputs.rspec-working-directory == 'servers/ruby' }}
        working-directory: clients/js
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Run RSpec
        working-directory: ${{ inputs.rspec-working-directory }}
        shell: bash
        run: |
          bundle exec rspec
