PreCommit:
  PythonChecks:
    enabled: true
    required: true
    requires_files: true
    include:
      - 'clients/python/**/*.py'
      - 'clients/python/pyproject.toml'
      - 'clients/python/uv.lock'
  HaveapiI18n:
    enabled: true
    required: true
  RuboCop:
    enabled: true
  PhpCsFixer:
    enabled: true
    command: 'php-cs-fixer'
CommitMsg:
  CapitalizedSubject:
    enabled: false
