name: RuboCop

on:
  push:
    paths:
      - "**/*.rb"
      - "**/*.gemspec"
      - "**/Gemfile*"
      - "**/Rakefile"
      - "**/bin/**"
      - "**/.rubocop*"
      - ".overcommit.yml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/rubocop.yml"
  pull_request:
    paths:
      - "**/*.rb"
      - "**/*.gemspec"
      - "**/Gemfile*"
      - "**/Rakefile"
      - "**/bin/**"
      - "**/.rubocop*"
      - ".overcommit.yml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/rubocop.yml"

jobs:
  rubocop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Ruby + Bundler cache
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run RuboCop
        shell: bash
        run: |
          bundle exec rubocop --parallel --force-exclusion
