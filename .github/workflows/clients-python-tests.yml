name: clients/python

on:
  push:
    paths:
      - 'clients/python/**'
      - 'utils/release/**'
      - 'servers/ruby/**'
      - 'doc/protocol.md'
      - 'doc/typed-input-validation.md'
      - '.github/workflows/clients-python-tests.yml'
      - '.git-hooks/pre_commit/python_checks.rb'
      - '.overcommit.yml'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths:
      - 'clients/python/**'
      - 'utils/release/**'
      - 'servers/ruby/**'
      - 'doc/protocol.md'
      - 'doc/typed-input-validation.md'
      - '.github/workflows/clients-python-tests.yml'
      - '.git-hooks/pre_commit/python_checks.rb'
      - '.overcommit.yml'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Format, lint, type check and unit tests
        run: clients/python/utils/check.sh
      - name: Install from wheel and standalone sdist
        working-directory: clients/python
        run: uv run --locked python utils/package_smoke.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
      - uses: ruby/setup-ruby@a89e929fdc35d88f2b8f20f26452c4adbeb9e371 # v1.330.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: servers/ruby
      - name: Run against the real HaveAPI server
        working-directory: clients/python
        run: uv run --locked pytest tests/integration
